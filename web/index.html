<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moteur de recherche d'images CBIR</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Moteur de recherche d'images</h1>

        <details class="card filters" id="filters" open>
            <summary><span>Filtres</span><small>Options de recherche</small></summary>
            <div class="opts">
                <label class="range-field">Nombre de résultats : <output id="kout" for="k">18</output>
                    <input id="k" type="range" min="1" max="50" value="18">
                    <span class="ends"><span>1</span><span>50</span></span>
                </label>

                <label>Type de recherche
                    <select id="mode">
                        <option value="both" selected>Texte + Image</option>
                        <option value="text">Texte</option>
                        <option value="image">Image</option>
                    </select>
                </label>

                <label id="operator-field">Opérateur
                    <select id="operator">
                        <option value="AND" selected>AND</option>
                        <option value="OR">OR</option>
                    </select>
                </label>

                <label>Base
                    <select id="dataset">
                        <option value="objects">Objects</option>
                        <option value="mirflickr">MIRFLICKR-25K</option>
                    </select>
                </label>

                <fieldset id="descs">
                    <legend>Descripteurs de l'image</legend>
                    <label><input type="checkbox" value="color" checked> Couleur (HSV, RGB)</label>
                    <label><input type="checkbox" value="lbp" checked> Texture (LBP)</label>
                    <label><input type="checkbox" value="hog" checked> Forme (HOG)</label>
                    <label><input type="checkbox" value="resnet" checked> Sémantique (ResNet)</label>
                    <label><input type="checkbox" value="mpeg7"> MPEG-7 (CLD, EHD, SCD)</label>
                </fieldset>
            </div>
        </details>

        <form id="form" class="card search-form">
            <p class="lead">Choisissez une option de recherche :</p>

            <div id="textbox">
                <label for="text">Mots-clés
                    <input id="text" type="text" placeholder="ex. butterfly, dog, ceiling fan">
                </label>
            </div>

            <div id="imagebox">
                <label class="drop" id="drop" for="file">
                    <input class="sr" id="file" type="file" accept="image/png,image/jpeg">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M7 18a4.5 4.5 0 0 1-.4-8.98A6 6 0 0 1 18 8.5a4 4 0 0 1 .5 7.97" />
                        <path d="M12 12v8M9 15l3-3 3 3" />
                    </svg>
                    <span class="drop-text"><strong>Glissez une image ici</strong><small>PNG ou JPEG — 10 Mo maximum</small></span>
                    <span class="btn">Parcourir</span>
                </label>

                <div id="query" class="query" hidden>
                    <img id="qimg" alt="Image requête">
                    <div class="query-copy"><strong>Image requête</strong><span id="qname"></span></div>
                    <button type="button" id="clear">Retirer</button>
                </div>
            </div>

            <button id="submit" type="submit" class="primary">Rechercher</button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>
        <section id="results" class="grid" aria-label="Résultats de la recherche"></section>
    </main>

    <footer>Réalisé par : <span id="authors">Besbes Ines &amp; Hamrouni Nesrine</span></footer>
    <script src="js/app.js"></script>
</body>
</html>
