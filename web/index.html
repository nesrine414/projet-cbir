<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moteur de recherche d'images CBIR</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <h1>Moteur de recherche d'images</h1>

        <details class="card" id="filters" open>
            <summary><span>Filtres</span><small>Options de recherche</small></summary>
            <div class="opts">
                <label>Nombre de resultats : <output id="kout" for="k">20</output>
                    <input id="k" type="range" min="1" max="50" value="20">
                    <span class="ends"><span>1</span><span>50</span></span>
                </label>
                <label>Type de recherche
                    <select id="mode">
                        <option value="image" selected>Image</option>
                        <option value="text">Texte</option>
                        <option value="combined">Texte + image</option>
                    </select>
                </label>
                <label id="opwrap" hidden>Combiner les critères
                    <select id="operator">
                        <option value="AND">AND — doit correspondre aux deux</option>
                        <option value="OR">OR — correspond à l’un ou l’autre</option>
                    </select>
                </label>
                <label>Base
                    <select id="dataset">
                        <option value="objects">Objects</option>
                        <option value="mirflickr">MIRFLICKR</option>
                    </select>
                    <small id="text-support">La recherche par mots-clés est disponible pour Objects.</small>
                </label>
                <fieldset id="descs" hidden>
                    <legend>Descripteurs de l'image</legend>
                    <label><input type="checkbox" value="color" checked> Couleur (HSV, RGB)</label>
                    <label><input type="checkbox" value="texture" checked> Texture (LBP)</label>
                    <label><input type="checkbox" value="shape" checked> Forme (HOG)</label>
                    <label><input type="checkbox" value="mpeg7" checked> MPEG-7 (CLD, EHD, SCD)</label>
                </fieldset>
            </div>
        </details>

        <form id="form" class="card">
            <p class="lead">Saisissez des mots-clés, choisissez une image, ou combinez les deux.</p>

            <div id="textbox" hidden>
                <label>Mots-cles
                    <input id="text" type="text" placeholder="ex. butterfly, dog, ceiling fan">
                </label>
            </div>

            <div id="imagebox">
                <label class="drop" id="drop">
                    <input class="sr" id="file" type="file" accept="image/png,image/jpeg">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M7 18a4.5 4.5 0 0 1-.4-8.98A6 6 0 0 1 18 8.5a4 4 0 0 1 .5 7.97" />
                        <path d="M12 12v8M9 15l3-3 3 3" />
                    </svg>
                    <span class="drop-text"><strong>Glissez une image ici</strong><small>PNG, JPG, JPEG - 10 Mo
                            maximum</small></span>
                    <span class="btn">Parcourir</span>
                </label>
                <div id="query" class="query" hidden>
                    <img id="qimg" alt="Image requete">
                    <div><strong>Image requete</strong>
                        <div id="qname"></div>
                    </div>
                    <button type="button" id="clear">Retirer</button>
                </div>
            </div>

            <button type="submit" class="primary">Rechercher</button>
        </form>

        <p id="status" role="status"></p>
        <section id="results" class="grid"></section>
    </main>
    <footer>Realise par : <span id="authors">Besbes Ines &amp; Hamrouni Nesrine</span></footer>
    <script src="js/app.js?v=mirflickr-text-guard"></script>
</body>

</html>
