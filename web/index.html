<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trouver par texte, explorer par image</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <h1>🔍 Trouver par texte, explorer par image 🖼️</h1>

        <details class="card" id="filters" open>
            <summary><span>Filtres</span><small>Options de recherche</small></summary>
            <div class="opts">
                <label>Résultats affichés : <output id="kout" for="k">12</output>
                    <input id="k" type="range" min="1" max="50" value="12">
                    <span class="ends"><span>1</span><span>50</span></span>
                </label>
                <label>Type de recherche
                    <select id="mode">
                        <option value="text">Texte</option>
                        <option value="image">Image</option>
                        <option value="both">Texte et image</option>
                    </select>
                </label>
                <label>Base
                    <select id="dataset">
                        <option value="objects">Objects</option>
                    </select>
                </label>
                <label id="opwrap" hidden>Combinaison
                    <select id="operator">
                        <option value="AND">ET (les deux critères)</option>
                        <option value="OR">OU (l'un ou l'autre)</option>
                    </select>
                </label>
                <fieldset id="descs" hidden>
                    <legend>Descripteurs de l'image</legend>
                    <label><input type="checkbox" value="color" checked> Couleur</label>
                    <label><input type="checkbox" value="lbp"> Texture (LBP)</label>
                    <label><input type="checkbox" value="hog"> Forme (HOG)</label>
                    <label><input type="checkbox" value="mpeg7"> MPEG-7</label>
                </fieldset>
            </div>
        </details>

        <form id="form" class="card">
            <p class="lead">Choisissez une option de recherche :</p>

            <div id="textbox">
                <label>Mots-clés
                    <input id="text" type="text" placeholder="ex. butterfly, chien, ceiling fan" autofocus>
                </label>
            </div>

            <div id="imagebox" hidden>
                <label class="drop" id="drop">
                    <input class="sr" id="file" type="file" accept="image/png,image/jpeg">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M7 18a4.5 4.5 0 0 1-.4-8.98A6 6 0 0 1 18 8.5a4 4 0 0 1 .5 7.97" />
                        <path d="M12 12v8M9 15l3-3 3 3" />
                    </svg>
                    <span class="drop-text"><strong>Glissez une image ici</strong><small>PNG, JPG, JPEG · 10 Mo
                            maximum</small></span>
                    <span class="btn">Parcourir</span>
                </label>
                <div id="query" class="query" hidden>
                    <img id="qimg" alt="Image requête">
                    <div><strong>Image requête</strong>
                        <div id="qname"></div>
                    </div>
                    <button type="button" id="clear">Retirer</button>
                </div>
            </div>

            <button type="submit" class="primary">Rechercher</button>
        </form>

        <p id="status" role="status"></p>
        <section id="results" class="grid"></section>
    </main>
    <footer>Réalisé par : <span id="authors">Besbes Ines &amp; Hamrouni Nesrine</span></footer>
    <script src="js/app.js"></script>
</body>

</html>
